name: vedantu-platform

services:
  # ============================================================================
  # 1. FRONTEND SERVICE (Next.js 16 Production Standalone)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    image: vedantu-frontend:latest
    container_name: vedantu-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    networks:
      - vedantu-app-network
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 500M

  # ============================================================================
  # 2. BACKEND SERVICE (FastAPI Production Runtime)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vedantu-backend:latest
    container_name: vedantu-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Application Core Settings
      PROJECT_NAME: "Vedantu Coding Assessment Platform"
      ENVIRONMENT: production
      DEBUG: "false"
      API_V1_STR: /api/v1
      HOST: "0.0.0.0"
      PORT: 8000
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'

      # Database Configuration (Resolves to 'postgres' container)
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB environment variable is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER environment variable is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}

      # Redis Cache & Session Configuration (Resolves to 'redis' container)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD environment variable is required}
      REDIS_DB: 0

      # Judge0 Integration (Resolves to 'judge0-server' container on port 2358)
      JUDGE0_URL: http://judge0-server:2358
      JUDGE0_AUTHN_HEADER: ${JUDGE0_AUTHN_HEADER:-X-Auth-Token}
      JUDGE0_AUTHN_TOKEN: ${JUDGE0_AUTHN_TOKEN:?JUDGE0_AUTHN_TOKEN environment variable is required}

      # Authentication & Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY environment variable is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      JWT_ISSUER: ${JWT_ISSUER:-vedantu-assessment-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-vedantu-assessment-users}
      INTERNAL_DEV_SECRET: ${INTERNAL_DEV_SECRET:-}

      # AI Evaluation & Static Analysis
      AI_EVALUATION_ENABLED: ${AI_EVALUATION_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-15.0}

      # Database Migrations on Startup (Disabled by default to prevent scaling races)
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    networks:
      - vedantu-app-network
      - vedantu-judge-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 500M

  # ============================================================================
  # 3. POSTGRESQL 16 DATABASE (Application Data Infrastructure)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: vedantu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB environment variable is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER environment variable is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - vedantu-app-network
    deploy:
      resources:
        limits:
          memory: 250M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER environment variable is required} -d ${POSTGRES_DB:?POSTGRES_DB environment variable is required}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 4. REDIS 7 IN-MEMORY BROKER (Application Cache & Token Invalidation)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: vedantu-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD environment variable is required}
      --appendonly yes
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD environment variable is required}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - vedantu-app-network
    deploy:
      resources:
        limits:
          memory: 100M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # 5. JUDGE0 SERVER (Isolated Code Execution Engine v1.13.1)
  # ============================================================================
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: vedantu-judge0-server
    restart: unless-stopped
    privileged: true
    env_file:
      - ./docker/judge0.conf
    environment:
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: judge0
      POSTGRES_USER: ${JUDGE0_DB_USER:-judge0_admin}
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:?JUDGE0_DB_PASSWORD environment variable is required}
      REDIS_HOST: judge0-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:?JUDGE0_REDIS_PASSWORD environment variable is required}
      AUTHN_HEADER: ${JUDGE0_AUTHN_HEADER:-X-Auth-Token}
      AUTHN_TOKEN: ${JUDGE0_AUTHN_TOKEN:?JUDGE0_AUTHN_TOKEN environment variable is required}
    ports:
      - "127.0.0.1:${JUDGE0_PORT:-2358}:2358"
    volumes:
      - ./docker/judge0.conf:/judge0.conf:ro
    networks:
      - vedantu-judge-network
      - vedantu-judge-internal-net
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 450M

  # ============================================================================
  # 6. JUDGE0 WORKERS (Background Execution Sandbox Workers)
  # ============================================================================
  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: vedantu-judge0-workers
    restart: unless-stopped
    command: ["./scripts/workers"]
    privileged: true
    env_file:
      - ./docker/judge0.conf
    environment:
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: judge0
      POSTGRES_USER: ${JUDGE0_DB_USER:-judge0_admin}
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:?JUDGE0_DB_PASSWORD environment variable is required}
      REDIS_HOST: judge0-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:?JUDGE0_REDIS_PASSWORD environment variable is required}
      COUNT: 1
    volumes:
      - ./docker/judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    networks:
      - vedantu-judge-internal-net
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 700M

  # ============================================================================
  # 7. JUDGE0 DATABASE (Dedicated Isolated PostgreSQL 16)
  # ============================================================================
  judge0-db:
    image: postgres:16-alpine
    container_name: vedantu-judge0-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: ${JUDGE0_DB_USER:-judge0_admin}
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:?JUDGE0_DB_PASSWORD environment variable is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data
    networks:
      - vedantu-judge-internal-net
    deploy:
      resources:
        limits:
          memory: 200M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JUDGE0_DB_USER:-judge0_admin} -d judge0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 8. JUDGE0 REDIS (Dedicated Isolated Redis 7 Queue)
  # ============================================================================
  judge0-redis:
    image: redis:7-alpine
    container_name: vedantu-judge0-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${JUDGE0_REDIS_PASSWORD:?JUDGE0_REDIS_PASSWORD environment variable is required}
      --maxmemory 48mb
      --maxmemory-policy noeviction
    environment:
      REDISCLI_AUTH: ${JUDGE0_REDIS_PASSWORD:?JUDGE0_REDIS_PASSWORD environment variable is required}
    volumes:
      - judge0_redis_data:/data
    networks:
      - vedantu-judge-internal-net
    deploy:
      resources:
        limits:
          memory: 100M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# ==============================================================================
# NETWORKS DEFINITIONS
# ==============================================================================
networks:
  vedantu-app-network:
    name: vedantu-app-network
    driver: bridge
  vedantu-judge-network:
    name: vedantu-judge-network
    driver: bridge
  vedantu-judge-internal-net:
    name: vedantu-judge-internal-net
    driver: bridge
    internal: true

# ==============================================================================
# VOLUMES DEFINITIONS (Persistent Application & Sandbox State)
# ==============================================================================
volumes:
  postgres_data:
    name: vedantu_postgres_data
  redis_data:
    name: vedantu_redis_data
  judge0_postgres_data:
    name: vedantu_judge0_postgres_data
  judge0_redis_data:
    name: vedantu_judge0_redis_data
